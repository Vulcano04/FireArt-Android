name: Build FireArt Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar FireArt
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Crear APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar archivo APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/FireArt.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: FireArt-APK
          path: output/FireArt.apk
          retention-days: 30
